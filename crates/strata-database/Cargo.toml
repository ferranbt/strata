[package]
name = "strata-database"
version = "0.1.0"
edition = "2024"

[dependencies]
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "migrate", "chrono", "uuid"] }
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
strata-schema.workspace = true
strata-types.workspace = true
strata-dockertest = { path = "../strata-dockertest", optional = true }

[features]
# Exposes `strata_database::testing::TestPostgres` for use in this crate's tests
# and in other crates' tests (enable via a dev-dependency with this feature).
test-support = ["dep:strata-dockertest"]

[dev-dependencies]
# Turn on `test-support` for our own tests (a crate may dev-depend on itself to
# enable a feature only for test/example/bench builds).
strata-database = { path = ".", features = ["test-support"] }
