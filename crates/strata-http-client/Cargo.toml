[package]
name = "strata-http-client"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
reqwest = { version = "0.12", features = ["json"] }
http.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
