[package]
name = "strata-spotify"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
strata-schema.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strata-sdk.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
strata-http-client.workspace = true

[[bin]]
name = "strata-spotify"
path = "cmd/main.rs"
