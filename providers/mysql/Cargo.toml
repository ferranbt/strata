[package]
name = "strata-mysql"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
schema.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strata-sdk.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "mysql"] }

[[bin]]
name = "strata-mysql"
path = "cmd/main.rs"

[dev-dependencies]
dockertest.workspace = true
