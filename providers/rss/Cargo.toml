[package]
name = "strata-rss"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
schema.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strata-sdk.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
http-client.workspace = true
feed-rs = "2.3.1"

[[bin]]
name = "strata-rss"
path = "cmd/main.rs"
