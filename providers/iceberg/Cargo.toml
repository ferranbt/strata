[package]
name = "strata-iceberg"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
schema.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strata-sdk.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
config-macro.workspace = true
futures = "0.3"
arrow = "58"
arrow-array = "58"
arrow-schema = "58"
iceberg = "0.10"
iceberg-catalog-sql = "0.10"
parquet = "58"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }

[[bin]]
name = "strata-iceberg"
path = "cmd/main.rs"
