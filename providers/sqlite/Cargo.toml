[package]
name = "strata-sqlite"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
strata-schema.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
strata-sdk.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }

[[bin]]
name = "strata-sqlite"
path = "cmd/main.rs"
